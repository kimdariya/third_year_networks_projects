services:
  peer-a4:
    build: .
    command: ["239.0.0.1"]
    networks:
      lan:
        ipv4_address: 172.20.0.10

  peer-b4:
    build: .
    command: ["239.0.0.1"]
    networks:
      lan:
        ipv4_address: 172.20.0.20

networks:
  lan:
    name: lab_1_lan
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1