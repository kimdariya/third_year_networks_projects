services:
  peer-a6:
    build: .
    command: ["ff05::1"]
    networks:
      lan:
        ipv6_address: fd00:20::10

  peer-b6:
    build: .
    command: ["ff05::1"]
    networks:
      lan:
        ipv6_address: fd00:20::20

networks:
  lan:
    name: lab_1_lan
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1
        - subnet: fd00:20::/64
          gateway: fd00:20::1